<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>PDF 大纲预览</title>
  <link rel="stylesheet" href="preview.css"/>
  <script src="editor.js" defer="defer"></script>
  <script src="preview.js" defer="defer"></script>
</head>
<body>
  <header><span class="eyebrow">ZOTERO RULE OUTLINE</span><h1>检查 PDF 大纲</h1><p id="filename"></p></header>
  <section class="summary"><strong id="count"></strong><span id="baseline"></span><button id="all" type="button">全选</button><button id="none" type="button">全不选</button></section>
  <p class="hint">大于正文字号，或单行不超过 40 字且以数字编号加文字开头，即列为候选。勾选后按数字编号或字号重新计算层级和上级标题；可编辑标题及页码，↑↓ 调整同页顺序。大纲写入原文件旁的新副本，原 PDF 保持不变。</p>
  <div class="table-wrap"><table><thead><tr><th>选择</th><th>标题</th><th>层级</th><th>上级标题</th><th>页码</th><th>字号</th><th>顺序</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="existing" class="existing" hidden="hidden"><label><input id="overwrite" type="checkbox"/>允许替换副本中的已有大纲（默认保留）</label><span id="existing-count"></span></div>
  <p id="status" role="status" aria-live="polite"></p>
  <footer><span>本地处理 · 同目录生成副本 · 保留原文件</span><button id="cancel" type="button">关闭</button><button id="write" class="primary" type="button">生成大纲副本</button><button id="open" class="primary" type="button" hidden="hidden">打开新 PDF</button></footer>
</body>
</html>
